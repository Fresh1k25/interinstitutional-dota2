<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUWEE DOTA 2 — Адмінка команд</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111d;color:#eaf8ff;font-family:Arial,Helvetica,sans-serif}header{padding:22px 5%;border-bottom:1px solid #1c5870;background:#081a29;position:sticky;top:0;z-index:5}h1{margin:0;font-size:28px}p{color:#8fb6c7}.wrap{max-width:1200px;margin:30px auto;padding:0 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.btn{border:1px solid #22b9ff;background:#0b2435;color:#eaf8ff;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.btn.primary{background:#12a9ef;color:#00101a}.status{padding:12px;border:1px solid #244a5d;border-radius:10px;background:#081a28;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#0a1d2c;border:1px solid #1d4b60;border-radius:14px;padding:18px;box-shadow:0 10px 35px #0005}.card h2{margin:0 0 15px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;color:#7fb6cc;text-transform:uppercase;letter-spacing:1px}input,textarea{width:100%;border:1px solid #29556a;background:#06131f;color:#fff;border-radius:8px;padding:10px;font:inherit}textarea{min-height:80px;resize:vertical}.players{display:grid;gap:8px}.logo-preview{width:70px;height:70px;border-radius:10px;border:1px solid #28556a;object-fit:contain;background:#06131f}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.small{font-size:12px;color:#789aaa}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>NUWEE × DOTA 2 — АДМІНКА КОМАНД</h1><p>Редагування профілю команди: капітан, 5 гравців, місто, прапор, місце та статус.</p></header>
<div class="wrap">
<div class="toolbar"><button class="btn" onclick="loadTeams()">↻ Оновити</button><a class="btn" href="index.html">← На сайт</a></div>
<div id="status" class="status">Завантаження...</div>
<div id="teams" class="grid"></div>
</div>
<script>
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const statusEl=document.getElementById('status');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function getDetails(t){const d=t.details||{};return {captain:d.captain||t.captain||'',players:Array.isArray(d.players)?d.players:(Array.isArray(t.players)?t.players:[]),flag:d.flag||t.flag||'',city:d.city||t.city||'',position:d.position||t.position||'',status:d.status||t.status||'У турнірі'};}
async function loadTeams(){
 statusEl.textContent='Завантаження команд...';
 const {data,error}=await db.from('teams').select('*').order('id');
 if(error){statusEl.textContent='Помилка: '+error.message;return;}
 document.getElementById('teams').innerHTML=data.map(t=>{const d=getDetails(t),p=[0,1,2,3,4].map(i=>d.players[i]||'').map(esc);return `
 <article class="card" data-id="${t.id}"><h2>${esc(t.name)}</h2>
 <div class="row"><div class="field"><label>Логотип URL / data</label><input class="logo" value="${esc(t.logo||'')}"></div><div><label>Поточний логотип</label><br><img class="logo-preview" src="${esc(t.logo||'')}" onerror="this.style.display='none'"></div></div>
 <div class="row"><div class="field"><label>Капітан</label><input class="captain" value="${esc(d.captain)}"></div><div class="field"><label>Прапор</label><input class="flag" placeholder="🇺🇦" value="${esc(d.flag)}"></div></div>
 <div class="row"><div class="field"><label>Місто</label><input class="city" value="${esc(d.city)}"></div><div class="field"><label>Поточне місце</label><input class="position" placeholder="1" value="${esc(d.position)}"></div></div>
 <div class="field full"><label>Статус</label><input class="teamstatus" value="${esc(d.status)}"></div>
 <div style="margin-top:14px"><label>Склад — 5 гравців</label><div class="players">${p.map((v,i)=>`<input class="player" placeholder="Гравець ${i+1}" value="${v}">`).join('')}</div></div>
 <div class="actions"><button class="btn primary" onclick="saveTeam(this)">💾 Зберегти</button></div>
 </article>`}).join('');
 statusEl.textContent=`Завантажено команд: ${data.length}`;
}
async function saveTeam(btn){
 const card=btn.closest('.card'),id=Number(card.dataset.id),players=[...card.querySelectorAll('.player')].map(x=>x.value.trim()).filter(Boolean);
 const details={captain:card.querySelector('.captain').value.trim(),players,flag:card.querySelector('.flag').value.trim(),city:card.querySelector('.city').value.trim(),position:card.querySelector('.position').value.trim(),status:card.querySelector('.teamstatus').value.trim()||'У турнірі'};
 const payload={logo:card.querySelector('.logo').value.trim(),details};
 btn.disabled=true;btn.textContent='Збереження...';
 let res=await db.from('teams').update(payload).eq('id',id);
 if(res.error && /details/i.test(res.error.message)){
   const fallback={logo:payload.logo,captain:details.captain,players:details.players,flag:details.flag,city:details.city,position:details.position,status:details.status};
   res=await db.from('teams').update(fallback).eq('id',id);
 }
 btn.disabled=false;btn.textContent='💾 Зберегти';
 if(res.error){statusEl.textContent='Помилка збереження: '+res.error.message;return;}
 statusEl.textContent=`Команду #${id} збережено.`;
}
loadTeams();
</script>
</body></html>
