<title>Interinstitutional — NUWEE Dota 2</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020b18;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* ================= HEADER ================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 70px;
    padding: 0 50px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(2, 12, 28, 0.9);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(70, 180, 255, 0.2);
}

.logo {
    font-size: 20px;
    font-weight: 900;
}

.logo span {
    color: #28b9ff;
}

nav {
    display: flex;
    gap: 25px;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.admin-button {
    background: #22aef5;
    color: #00101e;

    border: none;
    border-radius: 8px;

    padding: 10px 18px;

    font-weight: 800;
    cursor: pointer;
}

/* ================= HERO ================= */

.hero {
    min-height: 700px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            rgba(0, 15, 40, 0.35),
            rgba(0, 5, 15, 0.75)
        ),
        url("assets/hero-reference.png");

    background-size: cover;
    background-position: center;
}

.hero-content {
    width: 90%;
    max-width: 1400px;

    text-align: center;
}

.university {
    position: absolute;
    top: 50px;
    left: 60px;

    text-align: left;

    font-size: 14px;
    line-height: 1.5;
    font-weight: 600;
}

.title {
    font-size: clamp(50px, 8vw, 110px);
    font-weight: 900;

    letter-spacing: -5px;

    margin: 0;
}

.subtitle {
    font-size: 18px;
    font-weight: 800;

    letter-spacing: 5px;
}

.info {
    position: absolute;

    left: 60px;
    bottom: 60px;

    display: flex;
    gap: 40px;

    text-align: left;
}

.info-item {
    border-left: 3px solid #24baff;
    padding-left: 12px;
}

.info-item strong {
    display: block;
    font-size: 20px;
}

.info-item span {
    color: #9edaff;
    font-size: 13px;
}

.prize {
    position: absolute;

    right: 60px;
    bottom: 60px;

    text-align: right;
}

.prize span {
    color: #9edaff;
}

.prize strong {
    display: block;

    font-size: 42px;
}

/* ================= PLAYOFF ================= */

.playoffs {
    padding: 100px 50px;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 80, 170, 0.25),
            transparent 60%
        );
}

.section-title {
    max-width: 1400px;
    margin: auto;

    margin-bottom: 50px;
}

.section-title small {
    color: #30baff;
    font-weight: 800;
    letter-spacing: 3px;
}

.section-title h2 {
    font-size: 60px;
    margin: 10px 0;
}


/* ================= BRACKET ================= */

.bracket-wrapper {
    width: 100%;
    overflow: hidden;
    padding: 10px 0 50px;
}

.bracket {
    position: relative;
    width: 1840px;
    min-width: 1840px;
    height: 900px;
    margin: 0 auto;
    transform-origin: top left;
    will-change: transform;
}

/* ================= COLUMNS ================= */

.bracket-column {
    position: absolute;
    width: 220px;
    z-index: 2;
}

.bracket-column.r1-upper { left: 20px; top: 0; }
.bracket-column.r2-upper { left: 400px; top: 55px; }
.bracket-column.final-upper { left: 1180px; top: 165px; }

/* Нижня сітка спеціально опущена від верхньої */
.bracket-column.r1-lower { left: 20px; top: 545px; }
.bracket-column.r2-lower { left: 400px; top: 510px; }
.bracket-column.r3-lower { left: 790px; top: 555px; }
.bracket-column.final-lower { left: 1180px; top: 535px; }

.bracket-column.grand-final {
    left: 1560px;
    top: 285px;
}

/* ================= ROUND TITLE ================= */

.bracket-round-title {
    color: #fff;
    font-size: 15px;
    line-height: 1;
    font-weight: 900;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 9px;
    white-space: nowrap;
}

.bracket-round-date {
    display: block;
    margin-top: 4px;
    color: #9edaff;
    font-size: 11px;
    font-weight: 700;
}

/* ================= MATCH ================= */

.bracket-match {
    position: relative;
    width: 220px;
    height: 100px;
    box-sizing: border-box;

    background: rgba(4, 17, 34, 0.72);
    border: 3px solid rgba(235, 249, 255, 0.96);
    border-radius: 12px;
    overflow: hidden;

    box-shadow: 0 0 15px rgba(0, 150, 255, 0.10);
    backdrop-filter: blur(5px);

    z-index: 3;
}

.bracket-match.locked {
    opacity: .72;
}

.bracket-match.finished {
    box-shadow:
        0 0 18px rgba(0, 170, 255, .18),
        inset 0 0 20px rgba(0, 100, 180, .08);
}

.bracket-team {
    height: 47px;
    display: flex;
    align-items: center;
    box-sizing: border-box;

    border-bottom: 2px solid rgba(220, 245, 255, 0.85);
    padding: 0 0 0 10px;
}

.bracket-team:last-child {
    border-bottom: none;
}

.bracket-team.winner {
    background: rgba(0, 145, 255, .16);
}

.bracket-team-name {
    flex: 1;
    min-width: 0;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: #fff;
    font-size: 14px;
    font-weight: 800;
}

.bracket-logo-box {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    margin-right: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border: 2px solid rgba(155, 220, 255, .85);
    border-radius: 8px;
    background: rgba(8, 32, 58, .95);
    overflow: hidden;
    box-shadow: inset 0 0 12px rgba(0, 150, 255, .12);
}

/* Якщо логотип вже встановлений — рамка/квадрат автоматично зникає. */
.bracket-logo-box.has-logo {
    border-color: transparent;
    background: transparent;
    box-shadow: none;
}

.bracket-logo-box img {
    width: 34px;
    height: 34px;
    object-fit: contain;
    display: block;
}

.bracket-logo-placeholder {
    color: #9bdcff;
    font-size: 24px;
    line-height: 1;
    font-weight: 900;
}

.bracket-score {
    width: 48px;
    height: 100%;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-left: 2px solid rgba(220, 245, 255, 0.85);

    color: #fff;
    font-size: 22px;
    font-weight: 900;
}

/* ================= MATCH SPACING ================= */

.r1-upper .bracket-match + .bracket-match {
    margin-top: 18px;
}

.r2-upper .bracket-match + .bracket-match {
    margin-top: 100px;
}

.r1-lower .bracket-match + .bracket-match {
    margin-top: 38px;
}

.r2-lower .bracket-match + .bracket-match {
    margin-top: 100px;
}

/* ================= CONNECTORS ================= */

.bracket-lines {
    position: absolute;
    inset: 0;
    width: 1840px;
    height: 900px;
    z-index: 1;
    pointer-events: none;
}

.bracket-lines path {
    fill: none;
    stroke: rgba(120, 210, 255, .72);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

/* =========================================================
   PLAYOFFS — ОКРЕМИЙ БЛОК
   ========================================================= */

.playoffs {
    position: relative;
    padding: 80px 30px 100px;

    background:
        linear-gradient(
            180deg,
            #020b18 0%,
            #03172d 48%,
            #020b18 100%
        );

    border-top: 1px solid rgba(70, 180, 255, 0.14);
    border-bottom: 1px solid rgba(70, 180, 255, 0.14);

    overflow: hidden;
}

.playoffs::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0, 100, 220, 0.22),
            transparent 58%
        );

    pointer-events: none;
}

.playoffs > * {
    position: relative;
    z-index: 1;
}

.playoffs .section-title {
    max-width: 1600px;
    margin: 0 auto 35px;
    text-align: right;
}

.playoffs .section-title small {
    display: none;
}

.playoffs .section-title h2 {
    margin: 0;

    color: #fff;

    font-size: clamp(45px, 6vw, 75px);
    font-weight: 900;

    letter-spacing: -3px;

    text-shadow:
        0 0 25px rgba(0, 150, 255, 0.16);
}


/* =========================================================
   BRACKET PANEL
   ========================================================= */

.bracket-wrapper {
    position: relative;

    max-width: 1650px;
    margin: 0 auto;

    padding: 25px 20px 45px;

    background:
        linear-gradient(
            180deg,
            rgba(5, 29, 57, 0.62),
            rgba(2, 14, 29, 0.82)
        );

    border: 1px solid rgba(100, 200, 255, 0.13);
    border-radius: 20px;

    box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.28),
        inset 0 0 55px rgba(0, 100, 200, 0.045);

    overflow-x: auto;
    overflow-y: hidden;
}


/* =========================================================
   РОЗДІЛЮВАЧ
   ========================================================= */

.section-divider {
    height: 35px;

    background:
        #00050d;

    border-top: 1px solid rgba(60, 180, 255, 0.08);
    border-bottom: 1px solid rgba(60, 180, 255, 0.08);
}


/* =========================================================
   TEAMS — ОКРЕМИЙ ФОН
   ========================================================= */

.teams {
    position: relative;

    margin-top: 0;

    padding: 100px 50px 120px;

    background:
        linear-gradient(
            180deg,
            #010713 0%,
            #061a31 50%,
            #010713 100%
        );

    border-top: 1px solid rgba(60, 180, 255, 0.12);

    overflow: hidden;
}

.teams::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(0, 110, 230, 0.18),
            transparent 52%
        );

    pointer-events: none;
}

.teams > * {
    position: relative;
    z-index: 1;
}

.teams .section-title {
    max-width: 1400px;

    margin: 0 auto 45px;

    text-align: center;
}

.teams .section-title small {
    display: block;

    color: #30baff;

    font-size: 13px;

    font-weight: 900;

    letter-spacing: 4px;
}

.teams .section-title h2 {
    margin: 8px 0 0;

    color: #fff;

    font-size: clamp(42px, 5vw, 65px);

    font-weight: 900;

    letter-spacing: -2px;
}

.team-list {
    position: relative;

    max-width: 1400px;
    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(220px, 1fr));

    gap: 20px;
}

.team-card {
    min-height: 100px;

    background:
        linear-gradient(
            135deg,
            rgba(9, 38, 70, 0.95),
            rgba(4, 22, 43, 0.95)
        );

    border: 1px solid rgba(100, 200, 255, 0.18);

    border-radius: 14px;

    padding: 20px;

    display: flex;
    align-items: center;

    gap: 15px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.team-card:hover {
    transform: translateY(-4px);

    border-color: rgba(100, 210, 255, 0.5);

    box-shadow:
        0 15px 40px rgba(0, 120, 255, 0.15);
}

/* ================= TEAM LOGO — FIXED SQUARE ================= */

.team-logo-box {
    width: 78px;
    height: 78px;
    flex: 0 0 78px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid rgba(155, 220, 255, 0.85);
    border-radius: 10px;
    background: rgba(8, 32, 58, 0.95);
    overflow: hidden;

    box-shadow: inset 0 0 12px rgba(0, 150, 255, 0.12);
}

.team-logo-box img {
    display: block;

    /* Лого ніколи не збільшує картку — воно автоматично
       вписується в квадрат зі збереженням пропорцій. */
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;

    padding: 7px;
}

.team-logo-placeholder {
    color: #9bdcff;
    font-size: 34px;
    line-height: 1;
    font-weight: 900;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 700px) {

    .playoffs {
        padding: 60px 15px 70px;
    }

    .playoffs .section-title {
        text-align: left;
    }

    .bracket-wrapper {
        border-radius: 14px;
        padding: 10px 2px 25px;
    }

    .teams {
        padding: 70px 20px 90px;
    }

    .team-list {
        grid-template-columns: 1fr;
    }

    .team-logo-box {
        width: 64px;
        height: 64px;
        flex-basis: 64px;
    }

    .section-divider {
        height: 25px;
    }
}

/* ================= ADMIN ================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 1000;

    background: rgba(0, 5, 15, 0.85);

    backdrop-filter: blur(10px);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal.active {
    display: flex;
}

.admin-panel {
    width: 800px;
    max-width: 100%;

    max-height: 90vh;

    overflow-y: auto;

    background: #071a30;

    border: 1px solid #21638c;

    border-radius: 18px;

    padding: 30px;

    position: relative;
}

.close {
    position: absolute;

    right: 20px;
    top: 15px;

    background: none;
    border: none;

    color: white;

    font-size: 30px;

    cursor: pointer;
}

.admin-panel h2 {
    margin-top: 0;
}

.admin-team {
    display: grid;

    grid-template-columns:
        50px
        1fr
        90px
        120px;

    gap: 10px;

    align-items: center;

    padding: 12px 0;

    border-bottom: 1px solid rgba(100, 190, 255, 0.15);
}

.admin-team img {
    width: 45px;
    height: 45px;

    object-fit: contain;

    background: #0d2946;

    border-radius: 8px;
}

.admin-team input[type="text"],
.admin-team input[type="number"] {
    width: 100%;

    padding: 10px;

    background: #0a233d;

    color: white;

    border: 1px solid #205071;

    border-radius: 7px;
}

.upload {
    background: #123454;

    padding: 10px;

    border-radius: 7px;

    text-align: center;

    font-size: 12px;

    cursor: pointer;
}

.upload input {
    display: none;
}

.save {
    margin-top: 25px;

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #25b5fa;

    color: #00101c;

    font-weight: 900;

    cursor: pointer;
}


/* ================= ADMIN MATCHES ================= */

.admin-match-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.admin-game {
    padding: 12px;
    background: rgba(5, 30, 55, .65);
    border: 1px solid rgba(100, 190, 255, .16);
    border-radius: 10px;
}

.admin-game > strong {
    display: block;
    margin-bottom: 8px;
}

.admin-game-teams {
    display: grid;
    grid-template-columns: 1fr 60px 20px 60px 1fr;
    gap: 8px;
    align-items: center;
}

.admin-game-teams span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.admin-game-teams input {
    width: 100%;
    padding: 9px;
    background: #0a233d;
    color: white;
    border: 1px solid #205071;
    border-radius: 7px;
    text-align: center;
    font-weight: 900;
}

/* ================= MOBILE ================= */

@media(max-width: 700px) {

    header {
        padding: 0 20px;
    }

    nav a {
        display: none;
    }

    .university {
        left: 25px;
        top: 30px;
    }

    .info {
        left: 25px;
        bottom: 25px;

        gap: 15px;
    }

    .info-item strong {
        font-size: 14px;
    }

    .prize {
        right: 25px;
        bottom: 25px;
    }

    .prize strong {
        font-size: 25px;
    }

    .playoffs,
    .teams {
        padding: 70px 20px;
    }

    .section-title h2 {
        font-size: 42px;
    }

    .admin-game-teams {
        grid-template-columns: 1fr 50px 15px 50px 1fr;
        gap: 5px;
        font-size: 11px;
    }
}
</style>

<header><div class="logo">NUWEE <span>×</span> DOTA 2</div><nav><a href="index.html">Сайт</a></nav></header>
<div class="admin-wrap">
<div id="loginCard" class="card login"><h1>АДМІН-ПАНЕЛЬ</h1><p class="status">Увійдіть своїм акаунтом адміністратора.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">УВІЙТИ</button><p id="loginMsg" class="status"></p></div>
<div id="adminContent" class="hidden"><div class="card"><div class="topbar"><div><h1>АДМІН-ПАНЕЛЬ</h1><p class="status" id="userStatus"></p></div><button class="btn secondary" id="logoutBtn">ВИЙТИ</button></div></div>
<div class="card"><h2>КОМАНДИ</h2><div id="teamsAdmin"></div></div>
<div class="card"><h2>РЕЗУЛЬТАТИ МАТЧІВ</h2><p class="status">BO3 — до 2 перемог. Грандфінал BO5 — до 3 перемог.</p><div id="matchesAdmin"></div></div>
<div class="card"><button class="btn" id="saveBtn">ЗБЕРЕГТИ ВСІ ЗМІНИ</button><p id="saveMsg" class="status"></p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let teams=[],matches={};
const labels={U1:'1 раунд ВС — матч 1',U2:'1 раунд ВС — матч 2',U3:'1 раунд ВС — матч 3',U4:'1 раунд ВС — матч 4',U5:'2 раунд ВС — матч 1',U6:'2 раунд ВС — матч 2',UF:'Фінал ВС',L1:'1 раунд НС — матч 1',L2:'1 раунд НС — матч 2',L3:'2 раунд НС — матч 1',L4:'2 раунд НС — матч 2',L5:'3 раунд НС',LF:'Фінал НС',GF:'Грандфінал — BO5 (до 3 перемог)'};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(id,text){document.getElementById(id).textContent=text||'';}
function result(id){
  const m=matches[id]; if(!m||m.a==null||m.b==null) return null;
  const need=id==='GF'?3:2;
  if(Number(m.sa)>=need && Number(m.sb)<need) return {winner:m.a,loser:m.b};
  if(Number(m.sb)>=need && Number(m.sa)<need) return {winner:m.b,loser:m.a};
  return null;
}
function calcParticipants(){
  const p={};
  const r1=['U1','U2','U3','U4'];
  const r1r=r1.map(id=>result(id));
  p.U5=[r1r[0]?.winner??null,r1r[1]?.winner??null];
  p.U6=[r1r[2]?.winner??null,r1r[3]?.winner??null];
  p.L1=[r1r[0]?.loser??null,r1r[1]?.loser??null];
  p.L2=[r1r[2]?.loser??null,r1r[3]?.loser??null];
  const u5=result('U5'),u6=result('U6'),l1=result('L1'),l2=result('L2');
  p.UF=[u5?.winner??null,u6?.winner??null];
  p.L3=[u5?.loser??null,l1?.winner??null];
  p.L4=[u6?.loser??null,l2?.winner??null];
  const l3=result('L3'),l4=result('L4');
  p.L5=[l3?.winner??null,l4?.winner??null];
  const l5=result('L5'),uf=result('UF');
  p.LF=[l5?.winner??null,uf?.loser??null];
  const lf=result('LF');
  p.GF=[uf?.winner??null,lf?.winner??null];
  return p;
}
async function load(){
  const [tr,mr]=await Promise.all([
    db.from('teams').select('id,name,logo').order('id'),
    db.from('matches').select('id,a,b,sa,sb')
  ]);
  if(tr.error||mr.error) throw(tr.error||mr.error);
  teams=tr.data.map(t=>({...t,id:Number(t.id)}));
  matches=Object.fromEntries(mr.data.map(x=>[x.id,{...x,a:x.a==null?null:Number(x.a),b:x.b==null?null:Number(x.b),sa:Number(x.sa)||0,sb:Number(x.sb)||0}]));
  render();
}
function teamName(id){
  if(id==null) return 'Очікуємо';
  const t=teams.find(x=>x.id===id);
  return t?t.name:'Очікуємо';
}
function render(){
  document.getElementById('teamsAdmin').innerHTML=teams.map(t=>`<div class="team-row"><img id="preview-${t.id}" src="${esc(t.logo||'')}"><input id="name-${t.id}" type="text" value="${esc(t.name)}"><label class="upload">📁 ЛОГО<input type="file" accept="image/*" onchange="uploadLogo(event,${t.id})"></label></div>`).join('');
  const p=calcParticipants();
  const ids=Object.keys(labels);
  document.getElementById('matchesAdmin').innerHTML=ids.map(id=>{
    const m=matches[id]||{sa:0,sb:0};
    const participants=p[id]||[m.a,m.b];
    const a=participants[0],b=participants[1];
    const max=id==='GF'?3:2;
    const locked=(a==null||b==null);
    return `<div class="game ${locked?'game-locked':''}"><strong>${labels[id]}</strong><div class="game-grid"><span>${esc(teamName(a))}</span><input id="sa-${id}" type="number" min="0" max="${max}" value="${m.sa}" ${locked?'disabled':''}><span>:</span><input id="sb-${id}" type="number" min="0" max="${max}" value="${m.sb}" ${locked?'disabled':''}><span>${esc(teamName(b))}</span></div>${locked?'<small class="status">Команди з’являться автоматично після завершення попередніх матчів.</small>':''}</div>`;
  }).join('');
}
async function uploadLogo(event,id){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{const t=teams.find(x=>x.id===id);if(t){t.logo=reader.result;document.getElementById('preview-'+id).src=t.logo;}};
  reader.readAsDataURL(file);
}
async function save(){
  msg('saveMsg','Зберігаю...');
  try{
    for(const t of teams){
      t.name=document.getElementById('name-'+t.id).value.trim()||`Команда ${t.id}`;
      const {error}=await db.from('teams').update({name:t.name,logo:t.logo||null}).eq('id',t.id);
      if(error) throw error;
    }
    const p=calcParticipants();
    for(const id of Object.keys(labels)){
      const saEl=document.getElementById('sa-'+id),sbEl=document.getElementById('sb-'+id);
      if(!saEl||!sbEl||saEl.disabled) continue;
      const max=id==='GF'?3:2;
      const sa=Math.max(0,Math.min(max,Number(saEl.value)||0));
      const sb=Math.max(0,Math.min(max,Number(sbEl.value)||0));
      if(sa===max&&sb===max) throw new Error(labels[id]+' не може закінчитися з обома максимальними рахунками.');
      const {error}=await db.from('matches').update({sa,sb}).eq('id',id);
      if(error) throw error;
    }
    msg('saveMsg','Готово! Результати збережені. Наступні команди визначаються автоматично.');
    await load();
  }catch(e){msg('saveMsg','Помилка: '+(e.message||e));}
}
async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(session){
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
    document.getElementById('userStatus').textContent='Увійшли як '+(session.user.email||'адміністратор');
    try{await load();}catch(e){msg('saveMsg','Немає доступу: '+e.message);}
  }
}
document.getElementById('loginBtn').onclick=async()=>{msg('loginMsg','Вхід...');const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg('loginMsg',error.message);return}location.reload()};
document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
document.getElementById('saveBtn').onclick=save;
start();
</body></html>
