<!DOCTYPE html>
<html lang="uk" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — Dota 2 Championship</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dota: {
                            bg: '#080b11',
                            card: '#0f141f',
                            panel: '#161c2b',
                            border: '#232d42',
                            red: '#e53935',
                            redGlow: '#ff4655',
                            gold: '#f59e0b',
                            goldGlow: '#fbbf24',
                            cyan: '#06b6d4',
                            purple: '#a855f7',
                            text: '#e2e8f0'
                        }
                    },
                    fontFamily: {
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080b11;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(229, 57, 53, 0.20) 0%, transparent 65%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 15% 70%, rgba(245, 158, 11, 0.08) 0%, transparent 50%);
            color: #e2e8f0;
            background-attachment: fixed;
        }
        .dota-glass {
            background: linear-gradient(135deg, rgba(22, 28, 43, 0.94) 0%, rgba(12, 16, 25, 0.97) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        }
        #adminLoginScreen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1.25rem; background: #05070b; }
        #adminLoginScreen.hidden { display: none !important; }
        #adminAppShell.hidden { display: none !important; }
        .admin-login-card { width: min(100%, 440px); border: 1px solid rgba(229,57,53,.32); background: linear-gradient(145deg, rgba(20,22,30,.98), rgba(7,9,14,.98)); }
        .admin-login-input { width: 100%; background: #070a10; border: 1px solid #453039; border-radius: 12px; padding: 13px 15px; color: white; outline: none; }
        .news-editor-input { width: 100%; background: #080b11; border: 1px solid #3b2930; border-radius: 12px; padding: 11px 13px; color: #f8fafc; font-size: 12px; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-dota-red selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="adminLoginScreen">
        <div class="admin-login-card rounded-3xl p-7 sm:p-9 shadow-2xl">
            <div class="text-center mb-7">
                <div class="text-[10px] uppercase tracking-[.25em] text-dota-red font-black mb-2">Захищений доступ</div>
                <h1 class="font-rajdhani text-3xl font-black text-white">ВХІД В АДМІН-ПАНЕЛЬ</h1>
                <p class="text-xs text-gray-400 mt-2">Введи пароль організатора.</p>
            </div>
            <form onsubmit="loginToAdmin(event)" class="space-y-4">
                <label class="block text-xs text-gray-300 font-bold">Пароль</label>
                <input type="password" id="adminPasswordInput" placeholder="Введи пароль..." required class="admin-login-input">
                <p id="adminLoginError" class="hidden text-xs text-red-400">Неправильний пароль.</p>
                <button type="submit" class="w-full bg-dota-red hover:bg-red-700 text-white font-rajdhani font-black text-sm py-3.5 rounded-xl shadow-lg transition-all">УВІЙТИ</button>
            </form>
        </div>
    </div>

    <!-- ADMIN SHELL -->
    <div id="adminAppShell" class="hidden flex flex-col min-h-screen">
        <header class="sticky top-0 z-40 bg-dota-bg/95 backdrop-blur-md border-b border-dota-border shadow-2xl">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16 sm:h-20">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-dota-red flex items-center justify-center text-white font-bold">А</div>
                        <div><div class="font-rajdhani font-black text-white text-lg">АДМІН-ПАНЕЛЬ</div></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="index.html" class="bg-dota-panel border border-dota-border text-gray-200 text-xs font-bold px-3 py-2 rounded-xl">На сайт</a>
                        <button onclick="adminLogout()" class="bg-red-950 text-red-100 text-xs font-bold px-3 py-2 rounded-xl">Вийти</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow p-4 sm:p-8 max-w-7xl mx-auto w-full space-y-6">
            <div class="flex gap-3 border-b border-dota-border pb-4">
                <button id="admTabMatches" onclick="switchAdminTab('matches')" class="bg-dota-red text-white px-4 py-2 rounded-xl text-xs font-bold">Матчі та Сітка</button>
                <button id="admTabTeams" onclick="switchAdminTab('teams')" class="bg-dota-panel text-gray-300 px-4 py-2 rounded-xl text-xs font-bold">Команди</button>
                <button id="admTabNews" onclick="switchAdminTab('news')" class="bg-dota-panel text-gray-300 px-4 py-2 rounded-xl text-xs font-bold">Новини</button>
                <button id="admTabSettings" onclick="switchAdminTab('settings')" class="bg-dota-panel text-gray-300 px-4 py-2 rounded-xl text-xs font-bold">Налаштування</button>
            </div>

            <!-- TAB MATCHES -->
            <div id="adminSecMatches" class="space-y-4">
                <h3 class="font-rajdhani text-xl font-bold text-white">Керування результатами</h3>
                <div id="adminMatchesEditor" class="space-y-3"></div>
            </div>

            <!-- TAB TEAMS -->
            <div id="adminSecTeams" class="space-y-4 hidden">
                <div class="flex justify-between items-center">
                    <h3 class="font-rajdhani text-xl font-bold text-white">Керування командами</h3>
                    <button onclick="openTeamModal()" class="bg-dota-red text-white text-xs font-bold px-4 py-2 rounded-xl">Додати команду</button>
                </div>
                <div id="adminTeamsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- TAB NEWS -->
            <div id="adminSecNews" class="space-y-4 hidden">
                <div class="flex justify-between items-center">
                    <h3 class="font-rajdhani text-xl font-bold text-white">Керування новинами (з фотографіями)</h3>
                    <button onclick="openNewsEditor()" class="bg-dota-red text-white text-xs font-bold px-4 py-2 rounded-xl"><i class="fa-solid fa-plus mr-1"></i> Додати новину</button>
                </div>
                <div id="adminNewsList" class="grid grid-cols-1 gap-4"></div>
            </div>

            <!-- TAB SETTINGS -->
            <div id="adminSecSettings" class="space-y-4 hidden max-w-xl">
                <h3 class="font-rajdhani text-xl font-bold text-white">Налаштування</h3>
                <div class="dota-glass p-6 rounded-2xl space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 font-bold">Призовий фонд</label>
                        <input type="text" id="settingPrize" class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 font-bold">Twitch канал</label>
                        <input type="text" id="settingStream" class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white">
                    </div>
                    <button onclick="saveSettings()" class="bg-dota-gold text-black font-bold text-xs px-5 py-2.5 rounded-xl">Зберегти</button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL TEAM -->
    <div id="teamModal" class="fixed inset-0 z-50 hidden bg-black/85 flex items-center justify-center p-4">
        <div class="dota-glass max-w-xl w-full rounded-3xl p-6 relative space-y-4 max-h-[90vh] overflow-y-auto">
            <button onclick="closeTeamModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="teamModalTitle" class="font-rajdhani font-black text-2xl text-white">Команда</h3>
            <form id="teamForm" onsubmit="handleTeamFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="editTeamId">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Назва команди</label>
                    <input type="text" id="teamNameInput" required class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Тег</label>
                        <input type="text" id="teamTagInput" required class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Логотип (URL посилання на зображення)</label>
                        <input type="text" id="teamLogoInput" required class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white" placeholder="https://...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">MMR команди</label>
                    <input type="text" id="teamMmrInput" required class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white" placeholder="напр. 7500 MMR">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Капітан</label>
                    <input type="text" id="teamCaptainInput" required class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Ростер (5 гравців через кому)</label>
                    <input type="text" id="teamRosterInput" required class="w-full bg-dota-bg border border-dota-border rounded-xl px-4 py-2 text-xs text-white">
                </div>
                <button type="submit" class="w-full bg-dota-red text-white py-2.5 rounded-xl text-xs font-bold">Зберегти</button>
            </form>
        </div>
    </div>

    <!-- MODAL NEWS -->
    <div id="newsModal" class="fixed inset-0 hidden bg-black/85 flex items-center justify-center p-4 z-50">
        <div class="dota-glass w-full max-w-xl rounded-3xl p-6 relative space-y-4 max-h-[90vh] overflow-y-auto">
            <button onclick="closeNewsEditor()" class="absolute top-5 right-5 text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="newsModalTitle" class="font-rajdhani font-black text-2xl text-white">Новина</h3>
            <form id="newsForm" onsubmit="saveNewsFromForm(event)" class="space-y-3">
                <input type="hidden" id="editNewsId">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Заголовок</label>
                    <input type="text" id="newsTitleInput" required class="news-editor-input">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Дата</label>
                    <input type="text" id="newsDateInput" class="news-editor-input">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Посилання на фотографію (URL)</label>
                    <input type="url" id="newsImageInput" oninput="updateNewsImagePreview()" placeholder="https://..." class="news-editor-input">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Попередній перегляд фото</label>
                    <img id="newsImagePreview" src="" class="w-full h-32 object-cover rounded-xl border border-dota-border">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Текст новини</label>
                    <textarea id="newsDescInput" required class="news-editor-input h-24"></textarea>
                </div>
                <button type="submit" class="w-full bg-dota-red text-white py-2.5 rounded-xl text-xs font-bold">Зберегти новину</button>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'DotaAdmin2026!';
        let state = { prizePool: "6,000 ₴", teams: [], matches: [], news: [], streamUrl: "dota2ti" };

        window.onload = function() {
            loadFromLocalStorage();
            document.getElementById('adminPasswordInput')?.focus();
        };

        function loginToAdmin(event) {
            event.preventDefault();
            const val = document.getElementById('adminPasswordInput').value;
            if (val !== ADMIN_PASSWORD) {
                document.getElementById('adminLoginError').classList.remove('hidden');
                return;
            }
            document.getElementById('adminLoginScreen').classList.add('hidden');
            document.getElementById('adminAppShell').classList.remove('hidden');
            renderAdminView();
        }

        function adminLogout() {
            document.getElementById('adminAppShell').classList.add('hidden');
            document.getElementById('adminLoginScreen').classList.remove('hidden');
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('dota2_master_app_state');
            if (saved) {
                state = JSON.parse(saved);
            } else {
                // Дефолти
                state.teams = [
                    { id: 1, name: "KNU Lions", tag: "KNU", mmr: "7800 MMR", logo: "https://placehold.co/100x100/161c2b/e53935?text=LIONS", captain: "NightStalker", roster: ["InvokerPro", "StormKing", "AxeMaster", "RubickUA", "WardSaver"] },
                    { id: 2, name: "KPI Cyber Titans", tag: "KPI", mmr: "7500 MMR", logo: "https://placehold.co/100x100/161c2b/e53935?text=KPI", captain: "TechLord", roster: ["ShadowCarry", "VoidSpirit", "CentaurOff", "Clockwork", "OracleUA"] }
                ];
                state.news = [
                    { id: 1, title: "Стартував новий сезон!", date: "12 Листопада 2026", desc: "Розпочались ігри серед найкращих команд.", img: "https://placehold.co/600x400/161c2b/e53935?text=News" }
                ];
                state.matches = [];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('dota2_master_app_state', JSON.stringify(state));
        }

        function switchAdminTab(tab) {
            ['matches', 'teams', 'news', 'settings'].forEach(t => {
                document.getElementById(`admTab${t.charAt(0).toUpperCase()+t.slice(1)}`).className = "bg-dota-panel text-gray-300 px-4 py-2 rounded-xl text-xs font-bold";
                document.getElementById(`adminSec${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('hidden');
            });
            document.getElementById(`admTab${tab.charAt(0).toUpperCase()+tab.slice(1)}`).className = "bg-dota-red text-white px-4 py-2 rounded-xl text-xs font-bold";
            document.getElementById(`adminSec${tab.charAt(0).toUpperCase()+tab.slice(1)}`).classList.remove('hidden');
        }

        function renderAdminView() {
            document.getElementById('settingPrize').value = state.prizePool;
            document.getElementById('settingStream').value = state.streamUrl;

            // Команди в адмінці
            document.getElementById('adminTeamsList').innerHTML = state.teams.map(t => `
                <div class="bg-dota-bg p-4 rounded-xl border border-dota-border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="${t.logo}" class="w-10 h-10 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-white text-sm">${t.name} <span class="text-dota-gold text-xs">[${t.tag}]</span></h4>
                            <span class="text-[10px] text-gray-400">${t.mmr}</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openTeamModal(${t.id})" class="bg-dota-panel text-dota-gold text-xs px-3 py-1.5 rounded-lg font-bold">Редагувати</button>
                        <button onclick="deleteTeam(${t.id})" class="bg-red-950 text-red-200 text-xs px-3 py-1.5 rounded-lg font-bold">Видалити</button>
                    </div>
                </div>
            `).join('');

            // Новини в адмінці
            document.getElementById('adminNewsList').innerHTML = state.news.map(n => `
                <div class="bg-dota-bg p-4 rounded-xl border border-dota-border flex gap-4 items-center">
                    <img src="${n.img}" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-grow">
                        <span class="text-xs text-dota-gold">${n.date}</span>
                        <h4 class="text-white font-bold">${n.title}</h4>
                        <p class="text-xs text-gray-400 line-clamp-1">${n.desc}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openNewsEditor(${n.id})" class="bg-dota-panel text-white text-xs px-3 py-1.5 rounded-lg">Редагувати</button>
                        <button onclick="deleteNews(${n.id})" class="bg-red-950 text-red-200 text-xs px-3 py-1.5 rounded-lg">Видалити</button>
                    </div>
                </div>
            `).join('');
        }

        // Керування новинами
        function openNewsEditor(newsId = null) {
            const news = newsId ? state.news.find(n => n.id === newsId) : null;
            document.getElementById('newsForm').reset();
            document.getElementById('editNewsId').value = news ? news.id : '';
            document.getElementById('newsModalTitle').innerText = news ? 'Редагувати новину' : 'Додати новину';
            document.getElementById('newsTitleInput').value = news?.title || '';
            document.getElementById('newsDateInput').value = news?.date || new Date().toLocaleDateString('uk-UA');
            document.getElementById('newsImageInput').value = news?.img || '';
            document.getElementById('newsDescInput').value = news?.desc || '';
            updateNewsImagePreview();
            document.getElementById('newsModal').classList.remove('hidden');
        }

        function closeNewsEditor() {
            document.getElementById('newsModal').classList.add('hidden');
        }

        function updateNewsImagePreview() {
            const url = document.getElementById('newsImageInput').value;
            document.getElementById('newsImagePreview').src = url || 'https://placehold.co/600x400';
        }

        function saveNewsFromForm(event) {
            event.preventDefault();
            const editId = document.getElementById('editNewsId').value;
            const title = document.getElementById('newsTitleInput').value;
            const date = document.getElementById('newsDateInput').value;
            const img = document.getElementById('newsImageInput').value;
            const desc = document.getElementById('newsDescInput').value;

            if (editId) {
                const n = state.news.find(item => item.id == editId);
                if (n) { n.title = title; n.date = date; n.img = img; n.desc = desc; }
            } else {
                const newId = state.news.length ? Math.max(...state.news.map(n => n.id)) + 1 : 1;
                state.news.unshift({ id: newId, title, date, img, desc });
            }
            saveToLocalStorage();
            closeNewsEditor();
            renderAdminView();
        }

        function deleteNews(id) {
            if (confirm("Видалити цю новину?")) {
                state.news = state.news.filter(n => n.id !== id);
                saveToLocalStorage();
                renderAdminView();
            }
        }

        // Керування командами
        function openTeamModal(teamId = null) {
            const t = teamId ? state.teams.find(x => x.id === teamId) : null;
            document.getElementById('editTeamId').value = t ? t.id : '';
            document.getElementById('teamNameInput').value = t?.name || '';
            document.getElementById('teamTagInput').value = t?.tag || '';
            document.getElementById('teamLogoInput').value = t?.logo || '';
            document.getElementById('teamMmrInput').value = t?.mmr || '';
            document.getElementById('teamCaptainInput').value = t?.captain || '';
            document.getElementById('teamRosterInput').value = t?.roster ? t.roster.join(', ') : '';
            document.getElementById('teamModal').classList.remove('hidden');
        }

        function closeTeamModal() {
            document.getElementById('teamModal').classList.add('hidden');
        }

        function handleTeamFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editTeamId').value;
            const name = document.getElementById('teamNameInput').value;
            const tag = document.getElementById('teamTagInput').value;
            const logo = document.getElementById('teamLogoInput').value;
            const mmr = document.getElementById('teamMmrInput').value;
            const captain = document.getElementById('teamCaptainInput').value;
            const roster = document.getElementById('teamRosterInput').value.split(',').map(s => s.trim()).filter(Boolean);

            if (editId) {
                const t = state.teams.find(x => x.id == editId);
                if (t) { t.name = name; t.tag = tag; t.logo = logo; t.mmr = mmr; t.captain = captain; t.roster = roster; }
            } else {
                const newId = state.teams.length ? Math.max(...state.teams.map(t => t.id)) + 1 : 1;
                state.teams.push({ id: newId, name, tag, logo, mmr, captain, roster });
            }
            saveToLocalStorage();
            closeTeamModal();
            renderAdminView();
        }

        function deleteTeam(id) {
            if (confirm("Видалити команду?")) {
                state.teams = state.teams.filter(t => t.id !== id);
                saveToLocalStorage();
                renderAdminView();
            }
        }

        function saveSettings() {
            state.prizePool = document.getElementById('settingPrize').value;
            state.streamUrl = document.getElementById('settingStream').value;
            saveToLocalStorage();
            alert("Налаштування збережено!");
        }
    </script>
</body>
</html>
